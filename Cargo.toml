[package]
name = "tlk-tune"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "tlk-tune"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
realfft = "3.4"
unicode-width = "0.2"
ureq = { version = "2.10", features = ["json", "tls"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
