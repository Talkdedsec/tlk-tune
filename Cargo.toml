[package]
name = "tlk-tune"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Terminal music player for Windows: native decoding, album art, equaliser, synced lyrics, mouse and keyboard."
authors = ["Talkdedsec <292909750+Talkdedsec@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Talkdedsec/tlk-tune"
homepage = "https://github.com/Talkdedsec/tlk-tune"
keywords = ["music", "player", "terminal", "tui", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/.github", "/assets/*.png"]

[[bin]]
name = "tlk-tune"
path = "src/main.rs"

[dependencies]
arc-swap = "1.7"
crossterm = "0.28"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
realfft = "3.4"
unicode-width = "0.2"
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
