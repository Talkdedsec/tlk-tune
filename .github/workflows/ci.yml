name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  schedule:
    # The advisory database moves on its own, so ask it weekly rather than
    # only when somebody happens to push.
    - cron: '0 6 * * 1'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            binary: target/release/tlk-tune.exe
          - os: ubuntu-latest
            label: linux
            binary: target/release/tlk-tune
          - os: macos-latest
            label: macos
            binary: target/release/tlk-tune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers, which cpal needs to build on Linux
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: tlk-tune-${{ matrix.label }}
          path: ${{ matrix.binary }}

  msrv:
    # The manifest names a minimum Rust version. This is what makes that a
    # fact rather than a guess.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  audit:
    # Advisories are worth knowing about, but a new one landing in a
    # dependency is not a reason to block a release that was already built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Pull this version out of the changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($tag))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { "Release $tag." | Set-Content notes.md; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          if ($end) { $rest = $rest[0..($end - 2)] }
          $rest | Where-Object { $_ -notmatch '^\[[^\]]+\]: ' } | Set-Content notes.md -Encoding utf8
      - name: Checksum, so a download can be checked
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/tlk-tune.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tlk-tune.exe" | Set-Content SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS
          Add-Content notes.md ""
          Add-Content notes.md "### Checking the download"
          Add-Content notes.md ""
          Add-Content notes.md '```'
          Add-Content notes.md "Get-FileHash tlk-tune.exe -Algorithm SHA256"
          Add-Content notes.md "$hash"
          Add-Content notes.md '```'
      - uses: softprops/action-gh-release@v3
        with:
          name: tlk-tune ${{ github.ref_name }}
          body_path: notes.md
          files: |
            target/release/tlk-tune.exe
            SHA256SUMS
