name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  schedule:
    # The advisory database moves on its own, so ask it weekly rather than
    # only when somebody happens to push.
    - cron: '0 6 * * 1'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            binary: target/release/tlk-tune.exe
          - os: ubuntu-latest
            label: linux
            binary: target/release/tlk-tune
          - os: macos-latest
            label: macos
            binary: target/release/tlk-tune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers, which cpal needs to build on Linux
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: tlk-tune-${{ matrix.label }}
          path: ${{ matrix.binary }}

  msrv:
    # The manifest names a minimum Rust version. This is what makes that a
    # fact rather than a guess.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  audit:
    # Advisories are worth knowing about, but a new one landing in a
    # dependency is not a reason to block a release that was already built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    # One binary per platform, each named so a download says what it is.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: tlk-tune-windows-x86_64.exe
            built: target/release/tlk-tune.exe
          - os: ubuntu-latest
            label: linux
            asset: tlk-tune-linux-x86_64
            built: target/release/tlk-tune
          - os: macos-latest
            label: macos
            asset: tlk-tune-macos-aarch64
            built: target/release/tlk-tune
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers, which cpal needs to build on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Name it after the platform it runs on
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Notes from the changelog, checksums from the binaries
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          if grep -q "^## \[$tag\]" CHANGELOG.md; then
            awk -v tag="$tag" '
              $0 == "## [" tag "]" || index($0, "## [" tag "] -") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { next }
              on { print }
            ' CHANGELOG.md > notes.md
          else
            echo "Release $tag." > notes.md
          fi
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          {
            echo
            echo "### Checking a download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS            # linux, macos"
            echo "Get-FileHash <file> -Algorithm SHA256   # windows"
            echo '```'
          } >> notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: tlk-tune ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
